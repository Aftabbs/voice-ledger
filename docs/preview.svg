<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f18"/>
      <stop offset="1" stop-color="#141b2b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="980" height="620" fill="url(#bg)"/>

  <!-- phone frame -->
  <g filter="url(#shadow)">
    <rect x="60" y="40" width="330" height="540" rx="36" fill="#05070c"/>
    <rect x="72" y="56" width="306" height="508" rx="26" fill="#0f1420"/>
  </g>

  <!-- status/header -->
  <text x="225" y="98" text-anchor="middle" fill="#eef2f8" font-size="19" font-weight="700">Voice<tspan fill="#38b26a">Ledger</tspan></text>
  <text x="225" y="118" text-anchor="middle" fill="#93a0b4" font-size="12">बोलो, हिसाब हो गया</text>

  <!-- stat tiles -->
  <g font-size="10" fill="#93a0b4">
    <rect x="90" y="134" width="62" height="46" rx="10" fill="#1a2130"/>
    <text x="121" y="150" text-anchor="middle">बिक्री</text>
    <text x="121" y="168" text-anchor="middle" fill="#eef2f8" font-size="13" font-weight="700">₹2,340</text>

    <rect x="157" y="134" width="62" height="46" rx="10" fill="#1a2130"/>
    <text x="188" y="150" text-anchor="middle">उधार दिया</text>
    <text x="188" y="168" text-anchor="middle" fill="#e8944a" font-size="13" font-weight="700">₹750</text>

    <rect x="224" y="134" width="62" height="46" rx="10" fill="#1a2130"/>
    <text x="255" y="150" text-anchor="middle">पैसे आए</text>
    <text x="255" y="168" text-anchor="middle" fill="#4aae6f" font-size="13" font-weight="700">₹250</text>

    <rect x="291" y="134" width="62" height="46" rx="10" fill="#1a2130"/>
    <text x="322" y="150" text-anchor="middle">खर्चा</text>
    <text x="322" y="168" text-anchor="middle" fill="#d56a6a" font-size="13" font-weight="700">₹0</text>
  </g>

  <!-- mic button -->
  <circle cx="225" cy="248" r="48" fill="#38b26a"/>
  <rect x="213" y="228" width="24" height="34" rx="12" fill="#0f1420"/>
  <path d="M203 248a22 22 0 0 0 44 0" stroke="#0f1420" stroke-width="6" fill="none" stroke-linecap="round"/>
  <line x1="225" y1="270" x2="225" y2="280" stroke="#0f1420" stroke-width="6" stroke-linecap="round"/>
  <text x="225" y="312" text-anchor="middle" fill="#93a0b4" font-size="11">बटन दबाकर बोलें</text>

  <!-- confirm card -->
  <rect x="88" y="332" width="274" height="150" rx="16" fill="#1a2130"/>
  <rect x="88" y="332" width="4" height="150" rx="2" fill="#38b26a"/>
  <text x="106" y="358" fill="#93a0b4" font-size="11" font-style="italic">"सुरेश भाई को 250 का उधार लिख दो"</text>
  <text x="106" y="386" fill="#e8944a" font-size="13" font-weight="700">उधार दिया</text>
  <text x="106" y="410" fill="#eef2f8" font-size="15" font-weight="700">सुरेश भाई</text>
  <text x="342" y="410" text-anchor="end" fill="#eef2f8" font-size="18" font-weight="800">₹250</text>
  <rect x="106" y="428" width="110" height="34" rx="10" fill="#38b26a"/>
  <text x="161" y="450" text-anchor="middle" fill="#0f1420" font-size="12" font-weight="700">✓ ठीक है</text>
  <rect x="228" y="428" width="110" height="34" rx="10" fill="#232c40"/>
  <text x="283" y="450" text-anchor="middle" fill="#eef2f8" font-size="12" font-weight="700">✗ नहीं</text>

  <!-- bottom nav -->
  <g font-size="10" fill="#93a0b4">
    <rect x="72" y="530" width="306" height="34" fill="#1a2130"/>
    <text x="125" y="551" text-anchor="middle" fill="#eef2f8">🎙 बोलो</text>
    <text x="225" y="551" text-anchor="middle">📒 हिसाब</text>
    <text x="325" y="551" text-anchor="middle">👥 उधार</text>
  </g>

  <!-- callouts -->
  <g font-size="15" fill="#eef2f8">
    <text x="430" y="150" font-weight="700" font-size="17">Speak naturally</text>
    <text x="430" y="172" fill="#93a0b4" font-size="12">Hindi, Hinglish, or Marathi —</text>
    <text x="430" y="190" fill="#93a0b4" font-size="12">no menus, no typing.</text>
    <line x1="420" y1="140" x2="360" y2="130" stroke="#38b26a" stroke-width="1.5"/>

    <text x="430" y="240" font-weight="700" font-size="17">Confirms before writing</text>
    <text x="430" y="262" fill="#93a0b4" font-size="12">One tap catches any</text>
    <text x="430" y="280" fill="#93a0b4" font-size="12">mis-heard name or amount.</text>
    <line x1="420" y1="230" x2="360" y2="400" stroke="#e8944a" stroke-width="1.5"/>

    <text x="430" y="330" font-weight="700" font-size="17">Talks back</text>
    <text x="430" y="352" fill="#93a0b4" font-size="12">Ask "रमेश का कितना बाकी है?"</text>
    <text x="430" y="370" fill="#93a0b4" font-size="12">and get a spoken answer.</text>

    <text x="430" y="420" font-weight="700" font-size="17">Data never leaves the phone</text>
    <text x="430" y="442" fill="#93a0b4" font-size="12">The ledger lives in on-device storage.</text>
    <text x="430" y="460" fill="#93a0b4" font-size="12">The server only translates speech —</text>
    <text x="430" y="478" fill="#93a0b4" font-size="12">it stores nothing.</text>
  </g>

  <text x="430" y="540" fill="#5a6779" font-size="11" font-style="italic">Illustration of the interface — built from the project's real design tokens and a real verified transcript.</text>
</svg>
